name: iOS Release (TestFlight)

# Builds the iOS app on EAS (Expo's macOS cloud) and submits it to App Store
# Connect / TestFlight. Runs on a free ubuntu runner — EAS does the macOS build,
# so no expensive GitHub macOS minutes are used.
#
# Prerequisites (one-time, see docs/ci-cd-ios.md):
#   1. Apple Developer Program membership ($99/yr) — required by Apple.
#   2. `eas init` (writes a real extra.eas.projectId into app.json).
#   3. `eas credentials` — let EAS manage the iOS distribution cert + profile.
#   4. `eas submit -p ios` once, interactively, to store the App Store Connect
#      API key in EAS and create the app record.
#
# Required GitHub secret:
#   EXPO_TOKEN  — an Expo access token (expo.dev → Account → Access tokens).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build & submit to App Store Connect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS and submit to TestFlight
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive \
            --auto-submit
