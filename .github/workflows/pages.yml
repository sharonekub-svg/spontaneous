name: Deploy web to GitHub Pages

# Builds the Expo web export and publishes it to GitHub Pages so there's a live,
# publicly accessible instance of the app. Uses the repo's own GITHUB_TOKEN —
# no external secrets required. Served under /spontaneous (see app.config.js).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # self-dispatch fallback when a push-triggered deploy fails

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export web bundle
        env:
          EXPO_PUBLIC_BASE_URL: /spontaneous
        run: npx expo export --platform web

      # Stop GitHub Pages' Jekyll from dropping the _expo/ asset directory.
      - run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Push-triggered deploys intermittently fail server-side with
      # "Deployment failed, try again later." while an immediate retry of the
      # same commit succeeds — so retry once before failing the workflow.
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Push-triggered deployments have repeatedly failed server-side while
      # manually dispatched runs of the very same commit always succeed. If
      # both attempts failed on a push run, hand the deploy off to a
      # workflow_dispatch run of this workflow. Dispatch runs never re-dispatch
      # (event guard), so this cannot loop.
      - name: Hand off to a dispatch run
        if: github.event_name == 'push' && steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "::notice::Both deploy attempts failed; handed off to a workflow_dispatch run."

      - name: Fail when the deploy did not complete and no hand-off applies
        if: github.event_name != 'push' && steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: exit 1
