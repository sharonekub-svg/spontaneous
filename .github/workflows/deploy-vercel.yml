name: Deploy to Vercel

# Deploys the web app to Vercel from a GitHub Actions runner. Runners have open
# internet, so this works even when a deploy can't be driven from elsewhere.
# Requires ONE repo secret: VERCEL_TOKEN (Settings -> Secrets and variables ->
# Actions). No project linking needed — `--yes` creates/uses a project named
# after the repo. Supabase config comes from the committed .env.production.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          url=$(npx vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed to: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Live URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
